name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Covers all four non-Windows targets plus the msvc one, so a broken
        # target triple or archive layout shows up here rather than downstream.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        php: ['8.2', '8.4', '8.5']
        exclude:
          - { os: ubuntu-24.04-arm, php: '8.2' }
          - { os: macos-latest, php: '8.2' }

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi, zip
          ini-values: ffi.enable=1

      - name: Install dependencies
        # shyim/composer-binary-downloader downloads libsasso as part of this.
        run: composer install --no-interaction --no-progress

      - name: Verify the native library
        # composer install already downloaded it; this re-asserts it non-zero on
        # failure, so a broken target triple or archive layout fails here rather
        # than downstream. binary:list is diagnostic only and always exits 0.
        run: |
          composer binary:install
          composer binary:list

      - name: Test
        run: vendor/bin/phpunit
